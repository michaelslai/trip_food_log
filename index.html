<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f4ee"
  >

  <title>
    旅遊美食日誌
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #f7f4ee;

      color: #252525;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    .container {

      width:
        min(
          720px,
          100%
        );

      margin:
        0 auto;

      padding:
        calc(
          18px +
          env(
            safe-area-inset-top
          )
        )
        16px
        calc(
          45px +
          env(
            safe-area-inset-bottom
          )
        );
    }


    .header {

      text-align: center;

      margin-bottom: 18px;
    }


    .header h1 {

      margin: 0;

      font-size: 28px;
    }


    .header p {

      margin: 8px 0 0;

      color: #777;

      font-size: 14px;
    }


    .version-badge {

      display: inline-block;

      margin-top: 8px;

      padding: 4px 9px;

      border-radius: 999px;

      background: #ece8df;

      color: #777;

      font-size: 11px;

      font-weight: 600;
    }


    .card {

      background: #fff;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 16px;

      box-shadow:
        0
        4px
        20px
        rgba(
          0,
          0,
          0,
          .06
        );
    }


    h2 {

      margin: 0 0 10px;

      font-size: 20px;
    }


    label {

      display: block;

      margin: 15px 0 7px;

      font-size: 14px;

      font-weight: 700;
    }


    input,
    select,
    textarea {

      width: 100%;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 12px;

      background: #fff;

      color: #222;

      font-size: 16px;
    }


    textarea {

      min-height: 90px;

      resize: vertical;
    }


    button {

      border: 0;

      border-radius: 12px;

      padding: 12px 15px;

      font-size: 16px;

      cursor: pointer;

      touch-action: manipulation;
    }


    button:disabled {

      opacity: .55;

      cursor: default;
    }


    .btn-primary {

      width: 100%;

      margin-top: 17px;

      background: #e96c43;

      color: #fff;

      font-weight: 700;
    }


    .btn-secondary {

      background: #efefef;

      color: #333;
    }


    .btn-danger {

      background: #ffe8e8;

      color: #b00020;
    }


    .btn-location {

      width: 100%;

      margin-top: 7px;

      background: #eaf3ff;

      color: #245b9e;

      font-weight: 700;
    }


    .grid2 {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }


    .money-row {

      display: grid;

      grid-template-columns:
        130px 1fr;

      gap: 10px;
    }


    .timezone {

      margin-top: 7px;

      color: #777;

      font-size: 13px;
    }


    .location-box {

      margin-top: 10px;

      padding: 12px;

      background: #f5f8fc;

      border-radius: 12px;

      color: #555;

      font-size: 14px;

      line-height: 1.7;
    }


    .address-box {

      display: none;

      margin-top: 10px;

      padding: 12px;

      background: #f4faf4;

      border-radius: 12px;

      color: #445544;

      font-size: 14px;

      line-height: 1.6;
    }


    .address-title {

      margin-bottom: 5px;

      color: #327043;

      font-weight: 700;
    }


    .nearby-wrap {

      display: none;

      margin-top: 13px;
    }


    .nearby-title {

      margin-bottom: 5px;

      font-size: 15px;

      font-weight: 700;
    }


    .nearby-note {

      margin-bottom: 9px;

      color: #888;

      font-size: 12px;
    }


    .nearby-list {

      display: flex;

      flex-direction: column;

      gap: 8px;
    }


    .nearby-item {

      width: 100%;

      padding: 11px 12px;

      background: #fff;

      border:
        1px solid #e3e3e3;

      border-radius: 12px;

      text-align: left;
    }


    .nearby-name {

      display: block;

      font-size: 15px;

      font-weight: 700;
    }


    .nearby-meta {

      display: block;

      margin-top: 4px;

      color: #777;

      font-size: 12px;
    }


    .status-text {

      color: #777;

      font-size: 14px;

      line-height: 1.5;
    }


    .selected-shop {

      display: none;

      margin-top: 7px;

      color: #31724a;

      font-size: 13px;
    }


    .star-group {

      display: flex;

      gap: 5px;

      margin-top: 4px;

      font-size: 34px;
    }


    .star {

      color: #ccc;

      cursor: pointer;

      user-select: none;
    }


    .star.active {

      color: #f6b800;
    }


    .recommend-row {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 10px;

      padding: 13px;

      background: #fff8dd;

      border-radius: 12px;
    }


    .recommend-row input {

      width: 22px;

      height: 22px;

      margin: 0;

      flex: 0 0 auto;
    }


    .recommend-row label {

      margin: 0;

      font-size: 15px;

      cursor: pointer;
    }


    .tag-row {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 8px;
    }


    .record-tag {

      display: inline-block;

      padding: 5px 9px;

      border-radius: 999px;

      background: #f1f1f1;

      color: #555;

      font-size: 12px;
    }


    .record-tag.recommended {

      background: #fff2bd;

      color: #8a6200;

      font-weight: 700;
    }


    .photo-preview {

      display: none;

      width: 100%;

      max-height: 400px;

      margin-top: 10px;

      object-fit: cover;

      border-radius: 14px;
    }


    .small {

      margin-top: 6px;

      color: #888;

      font-size: 12px;
    }


    .toolbar {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 18px;
    }


    .toolbar button,
    .toolbar label {

      flex: 1;

      min-width: 130px;

      margin: 0;

      text-align: center;
    }


    .import-label {

      padding: 12px 15px;

      background: #efefef;

      border-radius: 12px;

      cursor: pointer;

      font-size: 16px;

      font-weight: 400;
    }


    .summary-card {

      padding: 16px;
    }


    .summary-title {

      margin-bottom: 12px;

      font-size: 17px;

      font-weight: 700;
    }


    .summary-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }


    .summary-item {

      background: #faf8f3;

      border-radius: 14px;

      padding: 13px;
    }


    .summary-label {

      color: #777;

      font-size: 12px;
    }


    .summary-value {

      margin-top: 5px;

      font-size: 21px;

      font-weight: 750;
    }


    .summary-rating {

      color: #f2a900;
    }


    /* =====================================
       搜尋 / 篩選
    ====================================== */

    .search-card {

      padding: 14px;
    }


    .search-wrap {

      position: relative;
    }


    .search-input {

      padding-left: 42px;
    }


    .search-icon {

      position: absolute;

      left: 14px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #888;

      pointer-events: none;
    }


    .search-result-info {

      margin-top: 8px;

      color: #777;

      font-size: 12px;
    }


    /* V2.4.1 篩選摘要 */

    .filter-status {

      margin-top: 12px;

      padding: 10px 12px;

      background: #faf8f3;

      border-radius: 10px;

      color: #666;

      font-size: 12px;

      line-height: 1.5;
    }


    /* V2.4.1 展開按鈕 */

    .filter-toggle {

      width: 100%;

      margin-top: 10px;

      padding: 11px;

      background: #f1f1f1;

      color: #444;

      font-size: 14px;

      font-weight: 700;
    }


    .filter-toggle.open {

      background: #fff0ea;

      color: #c74e2a;
    }


    /* V2.4.1 可收合區 */

    .filter-panel {

      display: none;

      margin-top: 14px;

      padding-top: 2px;
    }


    .filter-panel.open {

      display: block;
    }


    .filter-section {

      margin-top: 14px;

      padding-top: 14px;

      border-top:
        1px solid #eee;
    }


    .filter-section:first-child {

      margin-top: 0;

      padding-top: 0;

      border-top: 0;
    }


    .filter-title {

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: 700;

      color: #555;
    }


    .filter-chips {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }


    .filter-chip {

      padding: 8px 11px;

      border:
        1px solid #ddd;

      border-radius: 999px;

      background: #f7f7f7;

      color: #555;

      font-size: 13px;

      line-height: 1;

      white-space: nowrap;
    }


    .filter-chip.active {

      border-color: #e96c43;

      background: #fff0ea;

      color: #c74e2a;

      font-weight: 700;
    }


    .filter-chip.recommend.active {

      border-color: #e7b800;

      background: #fff5c9;

      color: #8b6700;
    }


    .filter-clear {

      display: none;

      width: 100%;

      margin-top: 10px;

      padding: 10px;

      background: #f1f1f1;

      color: #555;

      font-size: 13px;
    }


    .filter-clear.show {

      display: block;
    }


    /* =====================================
       日期群組 / 紀錄
    ====================================== */

    .date-group {

      margin-bottom: 14px;
    }


    .date-header {

      width: 100%;

      padding: 14px 15px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      background: #fff;

      border-radius: 16px;

      box-shadow:
        0
        3px
        14px
        rgba(
          0,
          0,
          0,
          .05
        );

      text-align: left;
    }


    .date-title {

      font-size: 17px;

      font-weight: 750;
    }


    .date-summary {

      margin-top: 4px;

      color: #777;

      font-size: 12px;

      line-height: 1.5;
    }


    .date-toggle {

      flex: 0 0 auto;

      color: #777;

      font-size: 18px;

      transition:
        transform .2s;
    }


    .date-group.collapsed
    .date-toggle {

      transform:
        rotate(-90deg);
    }


    .date-records {

      margin-top: 10px;
    }


    .date-group.collapsed
    .date-records {

      display: none;
    }


    .record-date {

      color: #777;

      font-size: 13px;
    }


    .record-store {

      margin-top: 7px;

      font-size: 21px;

      font-weight: 700;
    }


    .record-food {

      margin-top: 6px;

      font-size: 17px;
    }


    .record-photo {

      width: 100%;

      max-height: 430px;

      margin: 12px 0;

      object-fit: cover;

      border-radius: 14px;
    }


    .record-stars {

      margin-top: 7px;

      color: #f6b800;

      font-size: 20px;
    }


    .record-meta {

      margin-top: 8px;

      color: #555;

      font-size: 14px;

      line-height: 1.7;
    }


    .record-address {

      margin-top: 9px;

      padding: 10px;

      background: #f4faf4;

      border-radius: 10px;

      color: #4b604b;

      font-size: 13px;

      line-height: 1.6;
    }


    .record-note {

      margin-top: 10px;

      padding: 12px;

      background: #faf8f2;

      border-radius: 12px;

      white-space: pre-wrap;
    }


    .record-actions {

      display: flex;

      gap: 8px;

      margin-top: 14px;
    }


    .record-actions button {

      flex: 1;
    }


    .empty {

      padding: 30px 10px;

      color: #999;

      text-align: center;
    }


    #editIndicator {

      display: none;

      margin-bottom: 12px;

      padding: 10px;

      background: #fff5d9;

      border-radius: 10px;

      color: #805e00;

      font-size: 14px;
    }


    .source-note {

      margin-top: 12px;

      color: #999;

      font-size: 11px;

      line-height: 1.5;
    }


    @media(
      max-width:450px
    ) {

      .grid2 {

        grid-template-columns:
          1fr;
      }


      .money-row {

        grid-template-columns:
          115px 1fr;
      }


      .header h1 {

        font-size: 25px;
      }
    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      🍜 旅遊美食日誌
    </h1>

    <p>
      記錄旅途中吃過的每一道美食
    </p>

    <div
      id="versionText"
      class="version-badge"
    >
      V2.4.1
    </div>

  </div>


  <!-- =====================================
       統計
  ====================================== -->

  <div class="card summary-card">

    <div class="summary-title">
      📊 美食紀錄統計
    </div>


    <div class="summary-grid">


      <div class="summary-item">

        <div class="summary-label">
          紀錄數
        </div>

        <div
          id="summaryCount"
          class="summary-value"
        >
          0
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          平均評分
        </div>

        <div
          id="summaryRating"
          class="summary-value summary-rating"
        >
          -
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          台幣總額
        </div>

        <div
          id="summaryTWD"
          class="summary-value"
        >
          NT$0
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          日幣總額
        </div>

        <div
          id="summaryJPY"
          class="summary-value"
        >
          ¥0
        </div>

      </div>


    </div>

  </div>


  <!-- =====================================
       搜尋 + 可收合篩選
  ====================================== -->

  <div class="card search-card">


    <div class="search-wrap">

      <span class="search-icon">
        🔍
      </span>

      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="搜尋店家、餐點、分類、推薦、備註"
        autocomplete="off"
      >

    </div>


    <div
      id="searchResultInfo"
      class="search-result-info"
    >
      顯示全部紀錄
    </div>


    <div
      id="filterStatus"
      class="filter-status"
    >
      目前沒有啟用篩選
    </div>


    <button
      type="button"
      id="filterToggleButton"
      class="filter-toggle"
      onclick="toggleFilterPanel()"
    >
      ☰ 展開篩選
    </button>


    <!-- =====================================
         V2.4.1 收合區
    ====================================== -->

    <div
      id="filterPanel"
      class="filter-panel"
    >


      <!-- 餐別 -->

      <div class="filter-section">

        <div class="filter-title">
          🕐 餐別
        </div>


        <div
          id="mealFilterChips"
          class="filter-chips"
        >

          <button
            type="button"
            class="filter-chip active"
            data-filter-type="meal"
            data-filter-value=""
          >
            全部
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="meal"
            data-filter-value="早餐"
          >
            早餐
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="meal"
            data-filter-value="午餐"
          >
            午餐
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="meal"
            data-filter-value="下午茶"
          >
            下午茶
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="meal"
            data-filter-value="晚餐"
          >
            晚餐
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="meal"
            data-filter-value="宵夜"
          >
            宵夜
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="meal"
            data-filter-value="其他"
          >
            其他
          </button>

        </div>

      </div>


      <!-- 分類 -->

      <div class="filter-section">

        <div class="filter-title">
          🏷️ 分類
        </div>


        <div
          id="categoryFilterChips"
          class="filter-chips"
        >

          <button
            type="button"
            class="filter-chip active"
            data-filter-type="category"
            data-filter-value=""
          >
            全部
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="主食"
          >
            主食
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="麵飯"
          >
            麵飯
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="燒肉"
          >
            燒肉
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="火鍋"
          >
            火鍋
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="海鮮"
          >
            海鮮
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="小吃"
          >
            小吃
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="甜點"
          >
            甜點
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="飲料"
          >
            飲料
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="咖啡"
          >
            咖啡
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="酒類"
          >
            酒類
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="便利商店"
          >
            便利商店
          </button>

          <button
            type="button"
            class="filter-chip"
            data-filter-type="category"
            data-filter-value="其他"
          >
            其他
          </button>

        </div>

      </div>


      <!-- 推薦 -->

      <div class="filter-section">

        <div class="filter-title">
          ⭐ 推薦
        </div>


        <div class="filter-chips">

          <button
            type="button"
            id="recommendFilterButton"
            class="filter-chip recommend"
          >
            只看推薦 / 值得再訪
          </button>

        </div>

      </div>


    </div>


    <button
      type="button"
      id="clearFilterButton"
      class="filter-clear"
      onclick="clearAllFilters()"
    >
      ✕ 清除搜尋與所有篩選
    </button>


  </div>


  <!-- =====================================
       新增 / 編輯
  ====================================== -->

  <div class="card">

    <h2>
      新增美食紀錄
    </h2>


    <div id="editIndicator">
      ✏️ 目前正在編輯既有紀錄
    </div>


    <div class="grid2">


      <div>

        <label>
          📅 日期
        </label>

        <input
          type="date"
          id="date"
        >

      </div>


      <div>

        <label>
          🕒 時間
        </label>

        <input
          type="time"
          id="time"
        >

      </div>


    </div>


    <div
      id="timezoneText"
      class="timezone"
    >
      偵測時區中...
    </div>


    <label>
      📍 GPS / 地址 / 附近店家
    </label>


    <button
      id="locationButton"
      class="btn-location"
      type="button"
      onclick="getLocationAndNearby()"
    >
      📍 取得目前位置＋搜尋附近店家
    </button>


    <div
      id="locationBox"
      class="location-box"
    >
      尚未取得位置
    </div>


    <div
      id="addressBox"
      class="address-box"
    >

      <div class="address-title">
        🏠 自動辨識地址
      </div>

      <div id="addressText"></div>

    </div>


    <div
      id="nearbyWrap"
      class="nearby-wrap"
    >

      <div class="nearby-title">
        🏪 附近店家
      </div>

      <div class="nearby-note">
        依 GPS 距離排序，點選店家即可自動填入店名
      </div>

      <div
        id="nearbyList"
        class="nearby-list"
      ></div>

    </div>


    <label>
      🏪 店家名稱

/* =====================================
   IndexedDB
===================================== */

function openDB() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onerror =
      () => {

        reject(
          request.error
        );
      };


    request.onsuccess =
      () => {

        db =
          request.result;

        resolve(
          db
        );
      };


    request.onupgradeneeded =
      event => {

        const database =
          event.target.result;


        if (
          !database
            .objectStoreNames
            .contains(
              STORE_NAME
            )
        ) {

          const store =
            database
              .createObjectStore(
                STORE_NAME,
                {
                  keyPath:
                    "id",

                  autoIncrement:
                    true
                }
              );


          store.createIndex(
            "timestamp",
            "timestamp",
            {
              unique:
                false
            }
          );
        }
      };

  });
}


/* =====================================
   日期 / 時間
===================================== */

function setCurrentDateTime() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    )
    .padStart(
      2,
      "0"
    );


  const hour =
    String(
      now.getHours()
    )
    .padStart(
      2,
      "0"
    );


  const minute =
    String(
      now.getMinutes()
    )
    .padStart(
      2,
      "0"
    );


  document
    .getElementById(
      "date"
    )
    .value =
      `${year}-${month}-${day}`;


  document
    .getElementById(
      "time"
    )
    .value =
      `${hour}:${minute}`;
}


/* =====================================
   時區
===================================== */

function getTimezoneInfo() {

  const timezone =
    Intl
      .DateTimeFormat()
      .resolvedOptions()
      .timeZone;


  const offsetMinutes =
    -new Date()
      .getTimezoneOffset();


  const sign =
    offsetMinutes >= 0
      ? "+"
      : "-";


  const hours =
    Math.floor(
      Math.abs(
        offsetMinutes
      ) / 60
    );


  const minutes =
    Math.abs(
      offsetMinutes
    ) % 60;


  let gmt =
    `GMT${sign}${hours}`;


  if (
    minutes !== 0
  ) {

    gmt +=
      ":" +
      String(
        minutes
      )
      .padStart(
        2,
        "0"
      );
  }


  return {

    timezone,

    gmt,

    offsetMinutes

  };
}


function showTimezone() {

  const info =
    getTimezoneInfo();


  document
    .getElementById(
      "timezoneText"
    )
    .textContent =
      `🌏 ${info.timezone} · ${info.gmt}`;
}


/* =====================================
   GPS
===================================== */

function getGPSPosition() {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            "此瀏覽器不支援 GPS 定位"
          )
        );

        return;
      }


      navigator
        .geolocation
        .getCurrentPosition(

          resolve,

          reject,

          {

            enableHighAccuracy:
              true,

            timeout:
              20000,

            maximumAge:
              0

          }

        );

    }
  );
}

  locationBox.textContent =
    "正在取得目前位置...";


  addressBox.style.display =
    "none";


  nearbyWrap.style.display =
    "none";


  try {

    const position =
      await getGPSPosition();


    latitude =
      position.coords.latitude;


    longitude =
      position.coords.longitude;


    gpsAccuracy =
      Math.round(

    nearbyList.innerHTML = `

    const results =
      await Promise.allSettled([

        reverseGeocode(

    if (
      results[0].status ===

  } finally {

    button.disabled =
      false;


    button.textContent =
      "📍 重新定位＋搜尋附近店家";
  }
}


/* =====================================
   GPS → 地址
===================================== */

async function reverseGeocode(
  lat,
  lon
) {

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () => {

        controller.abort();

      },
      12000
    );


  const url =
    "https://nominatim.openstreetmap.org/reverse" +
    "?format=jsonv2" +
    "&lat=" +
    encodeURIComponent(
      lat
    ) +
    "&lon=" +
    encodeURIComponent(
      lon
    ) +
    "&zoom=18" +
    "&addressdetails=1" +
    "&accept-language=zh-TW,zh-Hant,zh,en,ja";


  try {

    const response =
      await fetch(
        url,
        {

          headers: {

            "Accept":
              "application/json"

          },

          signal:
            controller.signal

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "地址查詢服務目前無法使用"
      );
    }


    return await response.json();


  } finally {

    clearTimeout(
      timer
    );
  }
}


/* =====================================
   地址格式
===================================== */

function formatAddress(
  geo
) {

  if (
    !geo
  ) {

    return "";
  }


  const address =
    geo.address ||
    {};


  const parts =
    [];


  const candidates = [

    address.country,

    address.state ||
    address.province ||
    address.region,

    address.city ||
    address.town ||
    address.village ||
    address.municipality ||
    address.county,

    address.city_district ||
    address.district ||
    address.suburb ||
    address.neighbourhood,

    address.road ||
    address.pedestrian ||
    address.footway,

    address.house_number

  ];


  candidates.forEach(
    item => {

      if (
        item &&
        !parts.includes(
          item
        )
      ) {

        parts.push(
          item
        );
      }

    }
  );


  if (
    parts.length > 0
  ) {

    return parts.join(
      " "
    );
  }


  return (
    geo.display_name ||
    ""
  );
}


/* =====================================
   搜尋附近店家
===================================== */

async function searchNearbyPlaces(
  lat,
  lon
) {

  const radius =
    500;


  const query = `

[out:json][timeout:18];

(

  nwr
  ["amenity"~"restaurant|cafe|fast_food|food_court|ice_cream|bar|pub"]
  (around:${radius},${lat},${lon});


  nwr
  ["shop"~"bakery|convenience|deli|pastry|coffee|confectionery"]
  (around:${radius},${lat},${lon});

);

out center tags;

  `;


  const servers = [

    "https://overpass-api.de/api/interpreter",

    "https://overpass.kumi.systems/api/interpreter"

  ];


  let lastError =
    null;


  for (
    const server of
    servers
  ) {

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () => {

          controller.abort();

        },
        18000
      );


    try {

      const response =
        await fetch(
          server,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"

            },

            body:
              "data=" +
              encodeURIComponent(
                query
              ),

            signal:
              controller.signal

          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "附近店家服務 HTTP " +
          response.status
        );
      }


      const data =
        await response.json();


      return parseNearbyPlaces(
        data,
        lat,
        lon
      );


    } catch (error) {

      lastError =
        error;


    } finally {

      clearTimeout(
        timer
      );
    }
  }


  throw (
    lastError ||
    new Error(
      "附近店家服務目前無法使用"
    )
  );
}


/* =====================================
   整理附近店家
===================================== */

function parseNearbyPlaces(
  data,
  userLat,
  userLon
) {

  const places =
    [];


  for (
    const element of
    data.elements || []
  ) {

    const tags =
      element.tags ||
      {};


    const name =
      tags["name:zh-Hant"] ||
      tags["name:zh"] ||
      tags["name:ja"] ||
      tags.name ||
      tags.brand;


    if (
      !name
    ) {

      continue;
    }


    const placeLat =
      element.lat ??
      element.center?.lat;


    const placeLon =
      element.lon ??
      element.center?.lon;


    if (
      placeLat == null ||
      placeLon == null
    ) {

      continue;
    }


    places.push({

      name,

      lat:
        placeLat,

      lon:
        placeLon,

      distance:
        calculateDistance(
          userLat,
          userLon,
          placeLat,
          placeLon
        ),

      amenity:
        tags.amenity ||
        "",

      shop:
        tags.shop ||
        "",

      cuisine:
        tags.cuisine ||
        ""

    });
  }


  const uniqueMap =
    new Map();


  for (
    const place of
    places
  ) {

    const key =
      place.name
        .trim()
        .toLowerCase();


    if (
      !uniqueMap.has(
        key
      ) ||
      place.distance <
      uniqueMap.get(
        key
      ).distance
    ) {

      uniqueMap.set(
        key,
        place
      );
    }
  }


  return Array
    .from(
      uniqueMap.values()
    )
    .sort(
      (a, b) =>
        a.distance -
        b.distance
    )
    .slice(
      0,
      20
    );
}


/* =====================================
   距離計算
===================================== */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const earthRadius =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const deltaP =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const deltaL =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =

    Math.sin(
      deltaP / 2
    ) ** 2 +

    Math.cos(
      p1
    ) *

    Math.cos(
      p2
    ) *

    Math.sin(
      deltaL / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(

      Math.sqrt(
        a
      ),

      Math.sqrt(
        1 - a
      )

    );


  return Math.round(
    earthRadius *
    c
  );
}


/* =====================================

function placeTypeText(

    deli:

    pastry:
      "甜點店",

    coffee:
      "咖啡店",

    confectionery:
      "甜點店"

  };


  return (

  );
}

/* =====================================
   套用搜尋與篩選
===================================== */

function filterRecords(
  records
) {

  return records.filter(
    record => {

      if (
        searchKeyword
      ) {

        const recommendText =
          record.recommended
            ? "推薦 值得再訪"
            : "";


        const text = [

          record.store,
          record.food,
          record.note,
          record.address,
          record.mealType,
          record.foodCategory,
          recommendText

        ]
          .filter(
            Boolean
          )
          .join(
            " "
          )
          .toLowerCase();


        if (
          !text.includes(
            searchKeyword
          )
        ) {

          return false;
        }
      }


      if (
        selectedMealFilter &&
        record.mealType !==
        selectedMealFilter
      ) {

        return false;
      }


      if (
        selectedCategoryFilter &&
        record.foodCategory !==
        selectedCategoryFilter
      ) {

        return false;
      }


      if (
        recommendedOnly &&
        record.recommended !==
        true
      ) {

        return false;
      }


      return true;

    }
  );
}


/* =====================================
   總統計
===================================== */

function updateSummary(
  records
) {

  let totalTWD =
    0;

  let totalJPY =
    0;

  let ratingTotal =
    0;

  let ratingCount =
    0;


  records.forEach(
    record => {

      const amount =
        Number(
          record.amount
        ) || 0;


      if (
        record.currency ===
        "TWD"
      ) {

        totalTWD +=
          amount;
      }


      if (
        record.currency ===
        "JPY"
      ) {

        totalJPY +=
          amount;
      }


      if (
        Number(
          record.rating
        ) > 0
      ) {

        ratingTotal +=
          Number(
            record.rating
          );

        ratingCount++;
      }

    }
  );


  document.getElementById(
    "summaryCount"
  ).textContent =
    records.length.toLocaleString();


  document.getElementById(
    "summaryTWD"
  ).textContent =
    "NT$" +
    totalTWD.toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits:
          0
      }
    );


  document.getElementById(
    "summaryJPY"
  ).textContent =
    "¥" +
    totalJPY.toLocaleString(
      "ja-JP",
      {
        maximumFractionDigits:
          0
      }
    );


  document.getElementById(
    "summaryRating"
  ).textContent =

    ratingCount > 0

      ? (
          ratingTotal /
          ratingCount
        ).toFixed(
          1
        ) +
        " ⭐"

      : "-";
}

/* =====================================
   日期標題
===================================== */

function formatDateTitle(
  dateString
) {

  if (
    !dateString
  ) {

    return "未知日期";
  }


  const parts =
    dateString
      .split(
        "-"
      )
      .map(
        Number
      );


  if (
    parts.length !== 3
  ) {

    return dateString;
  }


  const year =
    parts[0];

  const month =
    parts[1];

  const day =
    parts[2];


  const date =
    new Date(
      year,
      month - 1,
      day
    );


  const weekday =
    [
      "日",
      "一",
      "二",
      "三",
      "四",
      "五",
      "六"
    ][
      date.getDay()
    ];


  return (
    `${year}/${month}/${day}（${weekday}）`
  );
}


/* =====================================
   每日統計
===================================== */

function calculateDailySummary(
  records
) {

  let totalTWD =
    0;

  let totalJPY =
    0;


  records.forEach(
    record => {

      const amount =
        Number(
          record.amount
        ) || 0;


      if (
        record.currency ===
        "TWD"
      ) {

        totalTWD +=
          amount;
      }


      if (
        record.currency ===
        "JPY"
      ) {

        totalJPY +=
          amount;
      }

    }
  );


  return {

    count:
      records.length,

    totalTWD,

    totalJPY

  };
}

===================================== */

function renderRecordsV2() {

  const records =
    filterRecords(
      allRecordsCache
    );


  updateFilterStatus();

  updateClearFilterButton();

  updateSummary(
    records
  );


  updateSearchInfo(
    records.length,
    allRecordsCache.length
  );


  const container =
    document.getElementById(
      "records"
    );


  container.innerHTML =
    "";


  if (
    records.length === 0
  ) {

    container.innerHTML = `

      <div class="card empty">

        找不到符合目前搜尋或篩選條件的美食紀錄 🔍

      </div>

    `;

    return;
  }


  const groups =
    new Map();


  records.forEach(
    record => {

      const date =
        record.date ||
        "未知日期";


      if (
        !groups.has(
          date
        )
      ) {

        groups.set(
          date,
          []
        );
      }


      groups
        .get(
          date
        )
        .push(
          record
        );

    }
  );


  const dates =
    Array
      .from(
        groups.keys()
      )
      .sort(
        (a, b) =>
          b.localeCompare(
            a
          )
      );


  dates.forEach(
    date => {

      const dayRecords =
        groups
          .get(
            date
          )
          .sort(
            (a, b) =>
              (
                b.timestamp ||
                ""
              )
              .localeCompare(
                a.timestamp ||
                ""
              )
          );


      const daily =
        calculateDailySummary(
          dayRecords
        );


      const group =
        document.createElement(
          "section"
        );


      group.className =
        "date-group";


      if (
        collapsedDates.has(
          date
        )
      ) {

        group.classList.add(
          "collapsed"
        );
      }


      const header =
        document.createElement(
          "button"
        );


      header.type =
        "button";


      header.className =
        "date-header";


      header.onclick =
        () => {

          toggleDateGroup(
            date
          );
        };


      const moneyParts =
        [];


      if (
        daily.totalTWD > 0
      ) {

        moneyParts.push(
          "NT$" +
          daily.totalTWD.toLocaleString(
            "zh-TW"
          )
        );
      }


      if (
        daily.totalJPY > 0
      ) {

        moneyParts.push(
          "¥" +
          daily.totalJPY.toLocaleString(
            "ja-JP"
          )
        );
      }


      const dailyMoney =

        moneyParts.length > 0

          ? moneyParts.join(
              "　"
            )

          : "尚未記錄金額";


      header.innerHTML = `

        <div>

          <div class="date-title">

            📅
            ${escapeHTML(
              formatDateTitle(
                date
              )
            )}

          </div>


          <div class="date-summary">

            ${daily.count}
            筆紀錄
            ·
            ${escapeHTML(
              dailyMoney
            )}

          </div>

        </div>


        <div class="date-toggle">
          ▼
        </div>

      `;


      const recordsWrap =
        document.createElement(
          "div"
        );


      recordsWrap.className =
        "date-records";


      dayRecords.forEach(
        record => {

          recordsWrap.appendChild(
            createRecordCard(
              record
            )
          );

        }
      );


      group.appendChild(
        header
      );


      group.appendChild(
        recordsWrap
      );


      container.appendChild(
        group
      );

    }
  );
}

/* =====================================
   金額格式
===================================== */

function formatCurrency(
  currency,
  amount
) {

  if (
    amount === null ||
    amount === undefined ||
    amount === ""
  ) {

    return "";
  }


  const number =
    Number(
      amount
    );


  if (
    currency ===
    "JPY"
  ) {

    return (
      "¥" +
      number.toLocaleString(
        "ja-JP",
        {
          maximumFractionDigits:
            0
        }
      )
    );
  }


  if (
    currency ===
    "TWD"
  ) {

    return (
      "NT$" +
      number.toLocaleString(
        "zh-TW",
        {
          maximumFractionDigits:
            0
        }
      )
    );
  }


  return (
    currency +
    " " +
    number.toLocaleString()
  );
}

/* =====================================
   照片壓縮
===================================== */

function compressImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const maxSize =
                1600;


              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                const scale =
                  Math.min(

                    maxSize /
                    width,

                    maxSize /
                    height

                  );


                width =
                  Math.round(
                    width *
                    scale
                  );


                height =
                  Math.round(
                    height *
                    scale
                  );
              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              if (
                !ctx
              ) {

                reject(
                  new Error(
                    "瀏覽器無法建立圖片處理畫布"
                  )
                );

                return;
              }


              ctx.drawImage(

                img,

                0,
                0,

                width,
                height

              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.78
                )
              );

            };


          img.onerror =
            () => {

              reject(
                new Error(
                  "無法讀取圖片"
                )
              );
            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "無法讀取照片"
            )
          );
        };


      reader.readAsDataURL(
        file
      );

    }
  );
}

        .toISOString(),

    appVersion:
      APP_VERSION

  };


  if (
    editingId !== null
  ) {

    const oldRecord =
      await getRecord(
        editingId
      );


    record.id =
      editingId;


    record.createdAt =
      oldRecord?.createdAt ||
      record.createdAt;


    record.updatedAt =
      new Date()
        .toISOString();
  }


  const transaction =
    db.transaction(
      STORE_NAME,
      "readwrite"
    );


  const store =
    transaction.objectStore(
      STORE_NAME
    );


  if (
    editingId !== null
  ) {

    store.put(
      record
    );

  } else {

    store.add(
      record
    );
  }


  transaction.oncomplete =
    async () => {

      resetForm();

      await loadRecords();
    };


  transaction.onerror =
    () => {

      alert(
        "儲存失敗，請再試一次"
      );
    };
}


/* =====================================
   讀取全部紀錄
===================================== */

function getAllRecords() {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.getAll();


      request.onsuccess =
        () => {

          resolve(
            request.result
          );
        };


      request.onerror =
        () => {

          reject(
            request.error
          );
        };

    }
  );
}


/* =====================================
   讀取單筆紀錄
===================================== */

function getRecord(
  id
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.get(
          id
        );


      request.onsuccess =
        () => {

          resolve(
            request.result
          );
        };


      request.onerror =
        () => {

          reject(
            request.error
          );
        };

    }
  );
}


/* =====================================
   載入紀錄
===================================== */

async function loadRecords() {

  const records =
    await getAllRecords();


  records.sort(
    (a, b) =>
      (
        b.timestamp ||
        ""
      )
      .localeCompare(
        a.timestamp ||
        ""
      )
  );


  allRecordsCache =
    records;


  renderRecordsV2();
}

/* =====================================
   匯出備份
===================================== */

async function exportData() {

  const records =
    await getAllRecords();


  if (
    records.length === 0
  ) {

    alert(
      "目前沒有資料可以匯出"
    );

    return;
  }


  const exportObject = {

    app:
      "Travel Food Diary",

    appVersion:
      APP_VERSION,

    backupVersion:
      4,

    exportedAt:
      new Date()
        .toISOString(),

    recordCount:
      records.length,

    records

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          exportObject,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    )
    .padStart(
      2,
      "0"
    );


  link.href =
    url;


  link.download =
    `travel-food-v${APP_VERSION}-${year}-${month}-${day}.json`;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );
}


/* =====================================
   備份檔讀取
===================================== */

function readBackupFile(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          resolve(
            event.target.result
          );
        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "無法讀取備份檔案"
            )
          );
        };


      reader.readAsText(
        file,
        "UTF-8"
      );

    }
  );
}


/* =====================================
   解析備份格式
===================================== */

function getBackupRecords(
  data
) {

  if (
    Array.isArray(
      data
    )
  ) {

    return data;
  }


  if (
    data &&
    Array.isArray(
      data.records
    )
  ) {

    return data.records;
  }


  if (
    data &&
    Array.isArray(
      data.foodRecords
    )
  ) {

    return data.foodRecords;
  }


  if (
    data &&
    Array.isArray(
      data.data
    )
  ) {

    return data.data;
  }


  if (
    data &&
    Array.isArray(
      data.items
    )
  ) {

    return data.items;
  }


  return null;
}


/* =====================================
   正規化文字
===================================== */

function normalizeText(
  value
) {

  return String(
    value ?? ""
  )
    .trim()
    .toLowerCase();
}


/* =====================================
   重複判斷 Key
===================================== */

function makeRecordDuplicateKey(
  record
) {

  const date =
    normalizeText(
      record.date
    );


  const time =
    normalizeText(
      record.time
    );


  const store =
    normalizeText(
      record.store
    );


  const food =
    normalizeText(
      record.food
    );


  const currency =
    normalizeText(
      record.currency
    );


  const amount =

    record.amount === null ||
    record.amount === undefined ||
    record.amount === ""

      ? ""

      : String(
          Number(
            record.amount
          )
        );


  const lat =

    record.latitude === null ||
    record.latitude === undefined

      ? ""

      : Number(
          record.latitude
        )
        .toFixed(
          5
        );


  const lon =

    record.longitude === null ||
    record.longitude === undefined

      ? ""

      : Number(
          record.longitude
        )
        .toFixed(
          5
        );


  return [

    date,
    time,
    store,
    food,
    currency,
    amount,
    lat,
    lon

  ].join(
    "|"
  );
}


/* =====================================
   整理匯入紀錄
===================================== */

function prepareImportedRecord(
  originalRecord
) {

  if (
    !originalRecord ||
    typeof originalRecord !==
    "object" ||
    Array.isArray(
      originalRecord
    )
  ) {

    return null;
  }


  const record = {
    ...originalRecord
  };


  delete record.id;


  if (
    !record.timestamp
  ) {

    if (
      record.date
    ) {

      record.timestamp =
        record.date +
        "T" +
        (
          record.time ||
          "00:00"
        );

    } else {

      record.timestamp =
        new Date()
          .toISOString()
          .slice(
            0,
            16
          );
    }
  }


  if (
    !record.createdAt
  ) {

    record.createdAt =
      new Date()
        .toISOString();
  }


  if (
    record.mealType ===
    undefined
  ) {

    record.mealType =
      "";
  }


  if (
    record.foodCategory ===
    undefined
  ) {

    record.foodCategory =
      "";
  }


  if (
    record.recommended ===
    undefined
  ) {

    record.recommended =
      false;
  }


  record.importedByVersion =
    APP_VERSION;


  return record;
}


/* =====================================
   匯入備份
   自動略過重複
===================================== */

document
  .getElementById(
    "importInput"
  )
  .addEventListener(
    "change",
    async event => {

      const input =
        event.target;


      const file =
        input.files &&
        input.files[0];


      if (
        !file
      ) {

        return;
      }


      try {

        if (
          !db
        ) {

          throw new Error(
            "資料庫尚未完成初始化，請重新整理網頁後再試一次"
          );
        }


        const text =
          await readBackupFile(
            file
          );


        if (
          !text ||
          !text.trim()
        ) {

          throw new Error(
            "備份檔案是空的"
          );
        }


        let data;


        try {

          data =
            JSON.parse(
              text
            );

        } catch (error) {

          throw new Error(
            "這不是有效的 JSON 備份檔"
          );
        }


        const backupRecords =
          getBackupRecords(
            data
          );


        if (
          !Array.isArray(
            backupRecords
          )
        ) {

          throw new Error(
            "找不到美食紀錄資料"
          );
        }


        if (
          backupRecords.length === 0
        ) {

          throw new Error(
            "備份內沒有任何紀錄"
          );
        }


        const existingRecords =
          await getAllRecords();


        const existingKeys =
          new Set();


        existingRecords.forEach(
          record => {

            existingKeys.add(
              makeRecordDuplicateKey(
                record
              )
            );

          }
        );


        const recordsToImport =
          [];


        let duplicateCount =
          0;


        let invalidCount =
          0;


        const backupSeenKeys =
          new Set();


        backupRecords.forEach(
          originalRecord => {

            const record =
              prepareImportedRecord(
                originalRecord
              );


            if (
              !record
            ) {

              invalidCount++;

              return;
            }


            const key =
              makeRecordDuplicateKey(
                record
              );


            if (
              existingKeys.has(
                key
              ) ||
              backupSeenKeys.has(
                key
              )
            ) {

              duplicateCount++;

              return;
            }


            backupSeenKeys.add(
              key
            );


            recordsToImport.push(
              record
            );

          }
        );


        const backupAppVersion =
          data &&
          data.appVersion
            ? data.appVersion
            : "舊版";


        if (
          recordsToImport.length === 0
        ) {

          input.value =
            "";


          alert(

            "ℹ️ 沒有需要匯入的新紀錄" +

            "\n\n" +

            "備份版本：" +
            backupAppVersion +

            "\n" +

            "備份共 " +
            backupRecords.length +
            " 筆" +

            "\n" +

            "重複紀錄：" +
            duplicateCount +
            " 筆" +

            (
              invalidCount > 0

                ? "\n無效紀錄：" +
                  invalidCount +
                  " 筆"

                : ""
            )

          );


          return;
        }


        const confirmed =
          confirm(

            "備份版本：" +
            backupAppVersion +

            "\n" +

            "備份共 " +
            backupRecords.length +
            " 筆" +

            "\n\n" +

            "可新增：" +
            recordsToImport.length +
            " 筆" +

            "\n" +

            "重複跳過：" +
            duplicateCount +
            " 筆" +

            (
              invalidCount > 0

                ? "\n無效跳過：" +
                  invalidCount +
                  " 筆"

                : ""
            ) +

            "\n\n" +

            "是否開始匯入？"

          );


        if (
          !confirmed
        ) {

          input.value =
            "";

          return;
        }


        const transaction =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const store =
          transaction.objectStore(
            STORE_NAME
          );


        recordsToImport.forEach(
          record => {

            store.add(
              record
            );

          }
        );


        transaction.oncomplete =
          async () => {

            input.value =
              "";


            await loadRecords();


            alert(

              "✅ 匯入完成" +

              "\n\n" +

              "新增：" +
              recordsToImport.length +
              " 筆" +

              "\n" +

              "重複跳過：" +
              duplicateCount +
              " 筆" +

              (
                invalidCount > 0

                  ? "\n無效跳過：" +
                    invalidCount +
                    " 筆"

                  : ""
              )

            );
          };


        transaction.onerror =
          () => {

            console.error(
              "Import Error:",
              transaction.error
            );


            input.value =
              "";


            alert(

              "❌ 匯入資料庫失敗" +

              "\n\n" +

              (
                transaction.error
                  ?.message ||
                "未知錯誤"
              )

            );
          };


      } catch (error) {

        console.error(
          "Backup Import Error:",
          error
        );


        input.value =
          "";


        alert(

          "❌ 無法匯入備份" +

          "\n\n" +

          (
            error.message ||
            error
          )

        );
      }

    }
  );


/* =====================================
   HTML 安全處理
===================================== */

function escapeHTML(
  value
) {

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}
